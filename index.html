<!doctype html>
<html lang="zh-TW" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>教學網站首頁</title>
    <script src="/_sdk/element_sdk.js"></script>
    <script src="/_sdk/data_sdk.js" type="text/javascript"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      * {
        box-sizing: border-box;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(12px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .fade-in {
        animation: fadeIn 0.8s ease-out forwards;
      }

      @view-transition {
        navigation: auto;
      }
    </style>
  </head>
  <body class="h-full bg-gradient-to-b from-amber-50 via-white to-white text-slate-900">
    <main
      id="main-wrapper"
      class="min-h-screen flex items-center justify-center px-6 py-12 transition-colors duration-300"
    >
      <section
        class="max-w-4xl w-full bg-white/80 backdrop-blur shadow-2xl shadow-amber-100 border border-amber-100 rounded-3xl px-10 py-12 fade-in"
      >
        <div class="flex flex-col gap-8">
          <header class="space-y-4 text-center">
            <p class="inline-flex items-center gap-2 text-sm font-medium text-amber-700 bg-amber-50 px-4 py-2 rounded-full">
              <span class="h-2 w-2 rounded-full bg-amber-500 animate-pulse"></span>
              探索專屬你的學習路徑
            </p>
            <h1 id="main-title" class="text-4xl sm:text-5xl font-extrabold tracking-tight leading-tight"></h1>
            <p id="subtitle" class="text-lg sm:text-xl text-slate-600 max-w-3xl mx-auto leading-relaxed"></p>
          </header>

          <div class="grid gap-4 sm:grid-cols-2">
            <div class="p-6 rounded-2xl bg-gradient-to-br from-white to-amber-50/70 border border-amber-100">
              <h2 class="text-xl font-semibold text-amber-700 mb-2">彈性課程設計</h2>
              <p class="text-slate-600 leading-relaxed">
                依照你的目標與時間安排進度，學習節奏完全由你掌握。
              </p>
            </div>
            <div class="p-6 rounded-2xl bg-gradient-to-br from-white to-amber-50/70 border border-amber-100">
              <h2 class="text-xl font-semibold text-amber-700 mb-2">實用學習資源</h2>
              <p class="text-slate-600 leading-relaxed">
                收錄範例、測驗與討論社群，立即把所學應用在實際場景。
              </p>
            </div>
          </div>

          <div class="flex flex-col sm:flex-row items-center justify-center gap-4">
            <button
              id="cta-button"
              class="px-10 py-4 rounded-full font-semibold text-lg shadow-lg shadow-amber-200 transition-all duration-300 focus:outline-none focus:ring-4 focus:ring-amber-200 hover:-translate-y-0.5"
              type="button"
            ></button>
            <span class="text-sm text-slate-500">加入 10,000+ 名學習者的行列</span>
          </div>
        </div>
      </section>
    </main>

    <script>
      const defaultConfig = {
        background_color: "#fef3c7",
        surface_color: "#ffffff",
        text_color: "#1f2937",
        primary_action_color: "#f59e0b",
        secondary_action_color: "#6b7280",
        font_family: "system-ui, -apple-system, sans-serif",
        font_size: 16,
        main_title: "開始你的學習旅程",
        subtitle: "探索豐富的線上課程，隨時隨地提升自己",
        cta_button_text: "立即開始"
      };

      function onConfigChange(config) {
        const backgroundColor = config.background_color || defaultConfig.background_color;
        const textColor = config.text_color || defaultConfig.text_color;
        const primaryActionColor = config.primary_action_color || defaultConfig.primary_action_color;
        const secondaryActionColor = config.secondary_action_color || defaultConfig.secondary_action_color;
        const surfaceColor = config.surface_color || defaultConfig.surface_color;
        const fontFamily = config.font_family || defaultConfig.font_family;
        const baseFontSize = config.font_size || defaultConfig.font_size;

        const fontStack = `${fontFamily}, system-ui, -apple-system, sans-serif`;
        const wrapper = document.getElementById("main-wrapper");
        wrapper.style.backgroundColor = backgroundColor;

        const mainTitle = document.getElementById("main-title");
        mainTitle.textContent = config.main_title || defaultConfig.main_title;
        mainTitle.style.fontSize = `${baseFontSize * 2.8}px`;
        mainTitle.style.fontFamily = fontStack;
        mainTitle.style.color = textColor;

        const subtitle = document.getElementById("subtitle");
        subtitle.textContent = config.subtitle || defaultConfig.subtitle;
        subtitle.style.fontSize = `${baseFontSize * 1.125}px`;
        subtitle.style.fontFamily = fontStack;
        subtitle.style.color = secondaryActionColor;

        const ctaButton = document.getElementById("cta-button");
        ctaButton.textContent = config.cta_button_text || defaultConfig.cta_button_text;
        ctaButton.style.backgroundColor = primaryActionColor;
        ctaButton.style.color = surfaceColor;
        ctaButton.style.fontFamily = fontStack;
        ctaButton.style.fontSize = `${baseFontSize * 1.05}px`;
      }

      function mapToCapabilities(config) {
        return {
          recolorables: [
            {
              get: () => config.background_color || defaultConfig.background_color,
              set: (value) => {
                config.background_color = value;
                if (window.elementSdk) {
                  window.elementSdk.setConfig({ background_color: value });
                }
              }
            },
            {
              get: () => config.surface_color || defaultConfig.surface_color,
              set: (value) => {
                config.surface_color = value;
                if (window.elementSdk) {
                  window.elementSdk.setConfig({ surface_color: value });
                }
              }
            },
            {
              get: () => config.text_color || defaultConfig.text_color,
              set: (value) => {
                config.text_color = value;
                if (window.elementSdk) {
                  window.elementSdk.setConfig({ text_color: value });
                }
              }
            },
            {
              get: () => config.primary_action_color || defaultConfig.primary_action_color,
              set: (value) => {
                config.primary_action_color = value;
                if (window.elementSdk) {
                  window.elementSdk.setConfig({ primary_action_color: value });
                }
              }
            },
            {
              get: () => config.secondary_action_color || defaultConfig.secondary_action_color,
              set: (value) => {
                config.secondary_action_color = value;
                if (window.elementSdk) {
                  window.elementSdk.setConfig({ secondary_action_color: value });
                }
              }
            }
          ],
          borderables: [],
          fontEditable: {
            get: () => config.font_family || defaultConfig.font_family,
            set: (value) => {
              config.font_family = value;
              if (window.elementSdk) {
                window.elementSdk.setConfig({ font_family: value });
              }
            }
          },
          fontSizeable: {
            get: () => config.font_size || defaultConfig.font_size,
            set: (value) => {
              config.font_size = value;
              if (window.elementSdk) {
                window.elementSdk.setConfig({ font_size: value });
              }
            }
          }
        };
      }

      function mapToEditPanelValues(config) {
        return new Map([
          ["main_title", config.main_title || defaultConfig.main_title],
          ["subtitle", config.subtitle || defaultConfig.subtitle],
          ["cta_button_text", config.cta_button_text || defaultConfig.cta_button_text]
        ]);
      }

      if (window.elementSdk) {
        window.elementSdk.init({
          defaultConfig,
          onConfigChange,
          mapToCapabilities,
          mapToEditPanelValues
        });
      } else {
        onConfigChange(defaultConfig);
      }

      document.getElementById("cta-button").addEventListener("click", function () {
        this.style.transform = "scale(0.97)";
        setTimeout(() => {
          this.style.transform = "scale(1.02)";
          setTimeout(() => {
            this.style.transform = "scale(1)";
          }, 120);
        }, 120);
      });
    </script>
  </body>
</html>
